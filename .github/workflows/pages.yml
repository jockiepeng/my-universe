name: Check and publish blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || github.repository }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY || '博客评论' }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_MOMENTS_DISCUSSION_NUMBER: ${{ vars.MOMENTS_DISCUSSION_NUMBER || '6' }}
      PUBLIC_MOMENTS_AUTHOR: ${{ vars.MOMENTS_AUTHOR || github.repository_owner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve Pages base path
        env:
          REPO: ${{ github.event.repository.name }}
          CUSTOM_SITE: ${{ vars.SITE_URL }}
          CUSTOM_BASE: ${{ vars.BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_SITE" ]; then
            echo "BASE_PATH=${CUSTOM_BASE:-/}" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${CUSTOM_BASE:-$REPO}" >> "$GITHUB_ENV"
          fi
      - name: Restore last successful moments snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: src/data/moments.json
          key: moments-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: moments-
      - name: Sync moments
        if: github.event_name != 'pull_request'
        id: sync_moments
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MOMENTS_TOKEN || secrets.GITHUB_TOKEN }}
          MOMENTS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || github.repository }}
          MOMENTS_DISCUSSION_NUMBER: ${{ vars.MOMENTS_DISCUSSION_NUMBER || '6' }}
          MOMENTS_AUTHOR: ${{ vars.MOMENTS_AUTHOR || github.repository_owner }}
        run: node scripts/sync-moments.mjs
      - name: Save moments snapshot
        if: steps.sync_moments.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/moments.json
          key: moments-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
