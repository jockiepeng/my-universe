name: Check and publish blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  discussions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'discussion_comment' || (github.event.discussion.number == fromJSON(vars.NEWS_DISCUSSION_NUMBER || '9') || github.event.discussion.number == fromJSON(vars.MOMENTS_DISCUSSION_NUMBER || '6') || (vars.LIFE_TIPS_DISCUSSION_NUMBER != '' && github.event.discussion.number == fromJSON(vars.LIFE_TIPS_DISCUSSION_NUMBER || '0')) || (vars.PLANS_DISCUSSION_NUMBER != '' && github.event.discussion.number == fromJSON(vars.PLANS_DISCUSSION_NUMBER || '0'))) }}
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || github.repository }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY || '博客评论' }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_MOMENTS_DISCUSSION_NUMBER: ${{ vars.MOMENTS_DISCUSSION_NUMBER || '6' }}
      PUBLIC_LIFE_TIPS_DISCUSSION_NUMBER: ${{ vars.LIFE_TIPS_DISCUSSION_NUMBER }}
      PUBLIC_PLANS_DISCUSSION_NUMBER: ${{ vars.PLANS_DISCUSSION_NUMBER }}
      PUBLIC_MOMENTS_AUTHOR: ${{ vars.MOMENTS_AUTHOR || github.repository_owner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve Pages base path
        env:
          REPO: ${{ github.event.repository.name }}
          CUSTOM_SITE: ${{ vars.SITE_URL }}
          CUSTOM_BASE: ${{ vars.BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_SITE" ]; then
            echo "BASE_PATH=${CUSTOM_BASE:-/}" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${CUSTOM_BASE:-$REPO}" >> "$GITHUB_ENV"
          fi
      - name: Restore last successful moments snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: src/data/moments.json
          key: moments-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: moments-
      - name: Sync moments
        if: github.event_name != 'pull_request'
        id: sync_moments
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MOMENTS_TOKEN || secrets.GITHUB_TOKEN }}
          MOMENTS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || github.repository }}
          MOMENTS_DISCUSSION_NUMBER: ${{ vars.MOMENTS_DISCUSSION_NUMBER || '6' }}
          MOMENTS_AUTHOR: ${{ vars.MOMENTS_AUTHOR || github.repository_owner }}
        run: node scripts/sync-moments.mjs
      - name: Save moments snapshot
        if: steps.sync_moments.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/moments.json
          key: moments-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore life tips snapshot
        if: github.event_name != 'pull_request' && vars.LIFE_TIPS_DISCUSSION_NUMBER != ''
        uses: actions/cache/restore@v4
        with:
          path: src/data/life-tips.json
          key: life-tips-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: life-tips-
      - name: Sync life tips
        if: github.event_name != 'pull_request' && vars.LIFE_TIPS_DISCUSSION_NUMBER != ''
        id: sync_life_tips
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MOMENTS_TOKEN || secrets.GITHUB_TOKEN }}
          MOMENTS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || github.repository }}
          LIFE_TIPS_DISCUSSION_NUMBER: ${{ vars.LIFE_TIPS_DISCUSSION_NUMBER }}
          MOMENTS_AUTHOR: ${{ vars.MOMENTS_AUTHOR || github.repository_owner }}
        run: node scripts/sync-life-tips.mjs
      - name: Save life tips snapshot
        if: steps.sync_life_tips.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/life-tips.json
          key: life-tips-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore plans snapshot
        if: github.event_name != 'pull_request' && vars.PLANS_DISCUSSION_NUMBER != ''
        uses: actions/cache/restore@v4
        with:
          path: src/data/plans.json
          key: plans-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: plans-
      - name: Sync plans
        if: github.event_name != 'pull_request' && vars.PLANS_DISCUSSION_NUMBER != ''
        id: sync_plans
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MOMENTS_TOKEN || secrets.GITHUB_TOKEN }}
          MOMENTS_REPO: ${{ vars.PUBLIC_GISCUS_REPO || github.repository }}
          PLANS_DISCUSSION_NUMBER: ${{ vars.PLANS_DISCUSSION_NUMBER }}
          MOMENTS_AUTHOR: ${{ vars.MOMENTS_AUTHOR || github.repository_owner }}
        run: node scripts/sync-plans.mjs
      - name: Save plans snapshot
        if: steps.sync_plans.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/plans.json
          key: plans-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore news snapshot
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: src/data/news.json
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-
      - name: Sync daily news
        if: github.event_name != 'pull_request'
        id: sync_news
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.NEWS_TOKEN || secrets.MOMENTS_TOKEN || secrets.GITHUB_TOKEN }}
          NEWS_REPO: ${{ github.repository }}
          NEWS_DISCUSSION_NUMBER: ${{ vars.NEWS_DISCUSSION_NUMBER || '9' }}
          NEWS_AUTHOR: ${{ vars.NEWS_AUTHOR || github.repository_owner }}
        run: node scripts/sync-news.mjs
      - name: Save news snapshot
        if: steps.sync_news.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/news.json
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
